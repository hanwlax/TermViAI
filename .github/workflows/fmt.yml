name: fmt

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.rs"
      - ".github/workflows/fmt.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.rs"
      - ".github/workflows/fmt.yml"

permissions:
  contents: read

concurrency:
  group: fmt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-code-formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Build
        run: |
          source $HOME/.cargo/env
          cargo +nightly fmt --all -- --check


      - name: Check native UI formatting
        run: |
          find termviai-gpui/src -name '*.rs' -print0 | xargs -0 rustfmt +nightly --edition 2024 --config skip_children=true,imports_granularity=Preserve --check
          rustfmt +nightly --edition 2024 --config skip_children=true,imports_granularity=Preserve --check termviai-gpui/build.rs
