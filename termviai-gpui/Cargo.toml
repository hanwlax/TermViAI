[package]
name = "termviai-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
fastrand = "2"
gpui = "=0.2.2"
gpui-component = { version = "=0.5.1", default-features = false }
gpui-component-assets = "=0.5.1"
config = { path = "../config" }
wezterm-term = { path = "../term" }
wezterm-ssh = { path = "../wezterm-ssh", features = ["vendored-openssl"] }
portable-pty = { path = "../pty" }
termwiz = { path = "../termwiz" }
termviai-broadcast = { path = "../termviai" }
filedescriptor = { path = "../filedescriptor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
tempfile = "3"
base64 = "0.22"
thiserror = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2
debug = 0
strip = "debuginfo"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "1.7"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
